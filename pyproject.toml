[project]
name = "storefront-backend"
version = "1.0.0"
description = "FastAPI backend for the Everyday Market storefront and admin portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pgserver>=0.1.4; python_version < '3.13'",  # embedded Postgres for TEST_WITH_POSTGRES=1; has no 3.13 wheel yet
]

[tool.fastapi]
entrypoint = "app.main:app"  # lets `fastapi run` / `fastapi dev` start the API with no path

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
